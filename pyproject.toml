[project]
name = "agentic-doc-rag"
version = "0.1.0"
description = "Agentic Doc RAG."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pydantic-settings>=2.4",
]
[project.optional-dependencies]
api = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pymupdf>=1.24",
  "qdrant-client>=1.15",
  "structlog>=25.1",
  "python-multipart>=0.0.9",
  "openai>=1.0",
  "limits[redis]>=5.8,<6",
  "redis>=5.0",
]

all = [
  "agentic-doc-rag[api]",
]

[dependency-groups]
dev = [
  "httpx>=0.27",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.11",
  "asgi-lifespan>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_rag"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
  "no_db: skip automatic test database cleanup for pure unit tests",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_configs = true
warn_return_any = true
no_implicit_optional = true
