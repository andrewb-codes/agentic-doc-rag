name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
      INTERNAL_API_KEY: test
      EMBEDDING_API_KEY: test
      LLM_API_KEY: test
      RATE_LIMIT_ENABLED: false
      BACKEND_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install dependencies
        run: uv sync --all-extras --group dev --locked

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run ruff
        run: uv run ruff check .

      - name: Run mypy
        run: uv run mypy src tests

      - name: Run tests
        run: uv run pytest

  deploy:
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: rag-production-deploy
      cancel-in-progress: false

    env:
      API_IMAGE: ghcr.io/${{ github.repository }}-api
      BOT_IMAGE: ghcr.io/${{ github.repository }}-bot
      APP_IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.api
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ env.APP_IMAGE_TAG }}
            ${{ env.API_IMAGE }}:main

      - name: Build and push bot image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.bot
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.BOT_IMAGE }}:${{ env.APP_IMAGE_TAG }}
            ${{ env.BOT_IMAGE }}:main

      - name: Set up SSH
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Set up Ansible
        run: python -m pip install ansible

      - name: Create Ansible inventory
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: |
          printf '[portfolio]\nportfolio-vps ansible_host=%s ansible_user=%s\n' "$VPS_HOST" "$VPS_USER" > deploy/ansible/inventory.ini

      - name: Deploy to VPS
        working-directory: deploy/ansible
        env:
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
          EMBEDDING_BASE_URL: ${{ vars.EMBEDDING_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          ansible-playbook playbook.yml \
            --extra-vars "internal_api_key=${INTERNAL_API_KEY}" \
            --extra-vars "telegram_bot_token=${TELEGRAM_BOT_TOKEN}" \
            --extra-vars "embedding_api_key=${EMBEDDING_API_KEY}" \
            --extra-vars "embedding_base_url=${EMBEDDING_BASE_URL}" \
            --extra-vars "llm_api_key=${LLM_API_KEY}" \
            --extra-vars "llm_base_url=${LLM_BASE_URL}" \
            --extra-vars "postgres_password=${POSTGRES_PASSWORD}" \
            --extra-vars "api_image=${API_IMAGE}" \
            --extra-vars "bot_image=${BOT_IMAGE}" \
            --extra-vars "app_image_tag=${APP_IMAGE_TAG}"
